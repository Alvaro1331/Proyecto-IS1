# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# =====================================================
spring.application.name=taller-api
server.port=8080

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/tallerdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin123

# --- JPA / Hibernate con MySQL ---
# update: crea las tablas si no existen y mantiene los datos guardados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Base de datos H2 (comentada tras migrar a MySQL) ---
# spring.datasource.url=jdbc:h2:mem:tallerdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- Correo (recuperación de contraseña de clientes) ---
# Si NO se define SPRING_MAIL_HOST, el código de recuperación se muestra en la consola del servidor
# en lugar de enviarse por correo (modo desarrollo).
# Para enviar correos de verdad, define estas VARIABLES DE ENTORNO (no escribas aquí tu contraseña,
# este archivo se sube a GitHub):
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_USERNAME=tu_cuenta@gmail.com
#   SPRING_MAIL_PASSWORD=contraseña_de_aplicación_de_Google
# En IntelliJ: Run > Edit Configurations > TallerApplication > Environment variables.
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

