# =====================================================
# CONFIGURACIÓN PARA DESARROLLO (H2 - Base de datos en memoria)
# =====================================================
spring.application.name=taller-api
server.port=8080

# --- Base de datos H2 ---
spring.datasource.url=jdbc:h2:mem:tallerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (puedes ver las tablas en http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: crea las tablas al arrancar y las borra al parar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Correo (recuperación de contraseña de clientes) ---
# Si NO se define SPRING_MAIL_HOST, el código de recuperación se muestra en la consola del servidor
# en lugar de enviarse por correo (modo desarrollo).
# Para enviar correos de verdad, define estas VARIABLES DE ENTORNO (no escribas aquí tu contraseña,
# este archivo se sube a GitHub):
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_USERNAME=tu_cuenta@gmail.com
#   SPRING_MAIL_PASSWORD=contraseña_de_aplicación_de_Google
# En IntelliJ: Run > Edit Configurations > TallerApplication > Environment variables.
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

