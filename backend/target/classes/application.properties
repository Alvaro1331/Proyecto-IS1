# =====================================================
# CONFIGURACIÓN PARA DESARROLLO (H2 - Base de datos en memoria)
# =====================================================
spring.application.name=taller-api
server.port=8080

# --- Base de datos H2 ---
spring.datasource.url=jdbc:h2:mem:tallerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (puedes ver las tablas en http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: crea las tablas al arrancar y las borra al parar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

